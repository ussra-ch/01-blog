<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3 py-5">
  <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">

    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Join 01Blog</h2>
      <p class="text-muted">Create your account to start sharing</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input formControlName="username" type="text" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input formControlName="email" type="email" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Bio</label>
        <textarea formControlName="bio" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input formControlName="password" type="password" class="form-control">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Profile Picture</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn btn-primary w-100 py-2 fw-bold">
        Register
      </button>

    </form>

    <div class="text-center mt-4">
      <a routerLink="/login" class="text-primary small">Already have an account? Login</a>
    </div>

  </div>
</div>
