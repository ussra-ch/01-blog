<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3">
  <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">

    <div class="text-center mb-4">
      <h2 class="fw-bold">Sign in</h2>
      <p class="text-muted small">Document your journey with the community</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label fw-medium">Username</label>
        <input formControlName="username" type="text" class="form-control" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-medium">Password</label>
        <input formControlName="password" type="password" class="form-control" required>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100">
        Sign in
      </button>

      <div class="mt-4 text-center">
        <p class="text-muted small">
          Don't have an account?
          <a routerLink="/register" class="text-primary fw-medium">
            Sign up for 01Blog
          </a>
        </p>
      </div>

    </form>
  </div>
</div>
