<div class="card post-card shadow-sm">
  <!-- Post Header -->
  <div class="card-body pb-0">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="d-flex gap-3 flex-grow-1">
        <img [src]="post.author.profilePicture || 'https://via.placeholder.com/48'"
             alt="Profile" class="rounded-circle" width="48" height="48" style="object-fit: cover;">
        <div>
          <h6 class="mb-0 fw-600">{{ post.author.username }}</h6>
          <small class="text-muted">{{ post.createdAt | date: 'short' }}</small>
        </div>
      </div>
      <div class="dropdown" *ngIf="isOwnPost">
        <button class="btn btn-link btn-sm text-secondary p-0" data-bs-toggle="dropdown">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" (click)="onEdit(); $event.preventDefault()">Edit</a></li>
          <li><a class="dropdown-item text-danger" href="#" (click)="onDelete(); $event.preventDefault()">Delete</a></li>
        </ul>
      </div>
    </div>

    <!-- Post Content -->
    <h5 class="card-title fw-700">{{ post.title }}</h5>
    <p class="card-text text-muted" *ngIf="post.description">{{ post.description }}</p>
  </div>

  <!-- Media -->
  <div *ngIf="post.mediaUrl" class="card-img-container">
    <img *ngIf="!isVideo()" [src]="post.mediaUrl" alt="Post media" class="card-img">
    <video *ngIf="isVideo()" controls class="card-img w-100" style="object-fit: cover;">
      <source [src]="post.mediaUrl" type="video/mp4">
      Your browser doesn't support HTML5 video.
    </video>
  </div>

  <!-- Stats & Actions -->
  <div class="card-footer bg-transparent border-top-0 pt-3 pb-0">
    <!-- Stats -->
    <div class="d-flex gap-3 mb-3 small text-muted">
      <span *ngIf="post.likeCount > 0">
        <strong>{{ post.likeCount }}</strong> like<span *ngIf="post.likeCount !== 1">s</span>
      </span>
      <span *ngIf="post.commentCount > 0">
        <strong>{{ post.commentCount }}</strong> comment<span *ngIf="post.commentCount !== 1">s</span>
      </span>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group w-100" role="group">
      <button type="button"
              (click)="toggleLike()"
              class="btn btn-light btn-sm post-action-btn">
        Like
      </button>
      <button type="button" (click)="onComment()" class="btn btn-light btn-sm post-action-btn">
        <i class="bi bi-chat"></i>
        Comment
      </button>
      <button type="button" class="btn btn-light btn-sm post-action-btn">
        <i class="bi bi-share"></i>
        Share
      </button>
    </div>
  </div>
</div>
