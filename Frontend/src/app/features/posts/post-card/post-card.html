<div class="post-card d-flex gap-3 align-items-start" (click)="openPost.emit(post)">

  <!-- Vote / Comment Actions -->
  <div class="post-actions">
    <button
      class="action-btn"
      [class.liked]="post.likedByCurrentUser"
      [disabled]="voting"
      (click)="toggleUpvote($event)"
      title="Upvote">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
      </svg>
      <span class="action-count">{{ upvotes }}</span>
    </button>

    <button class="action-btn" (click)="$event.stopPropagation(); openPost.emit(post)" title="Comments">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span class="action-count">{{ comments }}</span>
    </button>

    <button
      *ngIf="!isOwner"
      class="action-btn report-btn"
      [disabled]="reporting"
      (click)="reportPost($event)"
      title="Report post">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V5s-1 1-4 1-5-2-8-2-4 1-4 1v16" />
      </svg>
    </button>

    <div class="owner-menu-wrap" *ngIf="isOwner">
      <button
        class="action-btn settings-btn"
        [class.active]="ownerMenuOpen"
        (click)="toggleOwnerMenu($event)"
        title="Post settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0015 19.4a1.7 1.7 0 00-1 .6 1.7 1.7 0 00-.4 1.1V21h-4v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-.6-1 1.7 1.7 0 00-1.1-.4H3v-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-.6 1.7 1.7 0 00.4-1.1V3h4v.09A1.7 1.7 0 0015 4.6a1.7 1.7 0 001.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0019.4 9c.19.36.49.65.85.83.24.12.51.18.78.17H21v4h-.09a1.7 1.7 0 00-1.51 1z"/>
        </svg>
      </button>

      <div class="owner-menu" *ngIf="ownerMenuOpen" (click)="$event.stopPropagation()">
        <button class="owner-menu-item edit" (click)="editOwnerPost($event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          Edit
        </button>
        <button class="owner-menu-item delete" (click)="deleteOwnerPost($event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Post Body -->
  <div class="post-body flex-grow-1 min-w-0">

    <p class="post-action-error" *ngIf="actionError">
      {{ actionError }}
    </p>

    <!-- Author -->
    <div class="post-author d-flex align-items-center gap-2 mb-2">
      <a
        [routerLink]="['/profile', post.author.id]"
        (click)="$event.stopPropagation()"
        class="author-avatar-link">
        <div class="avatar" *ngIf="!authorAvatarSrc">
          {{ authorInitial }}
        </div>
        <img *ngIf="authorAvatarSrc as avatarSrc"
          [src]="avatarSrc"
          [alt]="post.author.username"
          class="avatar-img" />
      </a>
      <a
        class="author-name"
        [routerLink]="['/profile', post.author.id]"
        (click)="$event.stopPropagation()">
        {{ post.author.username }}
      </a>
    </div>

    <!-- Title -->
    <h2 class="post-title">{{ post.title }}</h2>

    <!-- Meta + Description -->
    <p class="post-meta mb-1">
      <!-- <span class="meta-time" [title]="formattedDate">{{ timeAgo }}</span> -->
      <!-- <span class="meta-dot">·</span>
      <span>{{ readTime }}</span> -->
      <span class="meta-dot" *ngIf="post.description">·</span>
      <span class="post-excerpt" *ngIf="post.description">
        {{ post.description | slice:0:120 }}{{ post.description.length > 120 ? '…' : '' }}
      </span>
    </p>

    <!-- Timestamp -->
    <p class="post-timestamp mt-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="me-1">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ formattedDate }}
    </p>
  </div>

  <!-- Thumbnail -->
  <div class="post-side">
    <div class="post-thumbnail" *ngIf="post.mediaUrl">
      <img
        *ngIf="hasVideo; else imageThumbnail"
        [src]="VIDEO_THUMBNAIL"
        [alt]="post.title + ' video thumbnail'" />
      <ng-template #imageThumbnail>
        <img [src]="mediaSrc" [alt]="post.title" />
      </ng-template>
    </div>
  </div>

</div>
