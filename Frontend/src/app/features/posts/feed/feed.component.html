<app-nav-bar></app-nav-bar>
<div *ngFor="let post of posts()">
  <div class="feed-wrapper">
  <div class="container-md">

    <!-- Posts Feed -->
    <!-- feed.component.html -->
    <app-post-card
      *ngFor="let post of posts()"
      [post]="post"
      (openPost)="selectedPost = $any($event)"
      (editPost)="onEditPost($event.postId)"
      (deletePost)="onDeletePost($event)">
    </app-post-card>

    <app-single-post
      *ngIf="selectedPost"
      [post]="selectedPost"
      (closed)="selectedPost = null"
      (commentAdded)="onCommentAdded($event)">
    </app-single-post>

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border spinner-sm mb-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-muted">Loading more stories...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="posts.length === 0 && !loading" class="empty-state text-center py-5">
      <i class="bi bi-inbox" style="font-size: 3rem; color: var(--border);"></i>
      <h5 class="text-muted mt-3">No posts yet</h5>
      <p class="text-muted">Start following users to see their stories here</p>
    </div>

    <!-- Infinite Scroll Trigger -->
    <div #scrollTrigger class="scroll-trigger"></div>
  </div>
</div>
</div>
